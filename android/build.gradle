buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20' }
}
plugins {
    id 'com.android.application' version '9.3.1'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
    id 'com.google.devtools.ksp' version '2.3.12'
}
android {
    namespace = 'org.crm.field'
    compileSdk = 37
    defaultConfig {
        applicationId = 'org.crm.field'
        minSdk = 28
        targetSdk = 37
        versionCode = 1
        versionName = '0.1-synthetic'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose = true; buildConfig = true }
    buildTypes {
        debug { buildConfigField 'String', 'API_BASE', '"http://10.0.2.2:3101"' }
        release { buildConfigField 'String', 'API_BASE', '""'; minifyEnabled = false }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    sourceSets { androidTest.assets.srcDirs += '../mobile/contracts' }
    packaging { resources.excludes += ['META-INF/AL2.0','META-INF/LGPL2.1'] }
}
dependencyLocking { lockAllConfigurations() }
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.sqlite:sqlite:2.7.1'
    implementation 'net.zetetic:sqlcipher-android:4.19.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
