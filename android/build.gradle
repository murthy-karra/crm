buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20' }
}
plugins {
    id 'com.android.application' version '9.3.1'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
    id 'com.google.devtools.ksp' version '2.3.12'
}
android {
    namespace = 'org.crm.field'
    compileSdk = 37
    defaultConfig {
        applicationId = 'org.crm.field'
        minSdk = 28
        targetSdk = 37
        versionCode = 1
        versionName = '0.1-synthetic'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    // The QA flavor is deliberately an additional, compile-time only identity.  The demo
    // build remains the normal org.crm.field/3101 build and release still has no origin.
    flavorDimensions += 'origin'
    productFlavors {
        demo {
            dimension 'origin'
            applicationId 'org.crm.field'
            buildConfigField 'String', 'API_BASE', '"http://10.0.2.2:3101"'
            buildConfigField 'String', 'VAULT_NAMESPACE', '"field"'
        }
        mobile002qa {
            dimension 'origin'
            applicationId 'org.crm.field.mobile002qa'
            testApplicationId 'org.crm.field.mobile002qa.test'
            buildConfigField 'String', 'API_BASE', '"http://10.0.2.2:3102"'
            buildConfigField 'String', 'VAULT_NAMESPACE', '"field.mobile002qa"'
        }
        // Mobile 003 live work has its own package and encrypted store. It never overwrites the
        // demonstration app or the preserved Mobile 002 upgrade fixture.
        mobile003qa {
            dimension 'origin'
            applicationId 'org.crm.field.mobile003qa'
            testApplicationId 'org.crm.field.mobile003qa.test'
            buildConfigField 'String', 'API_BASE', '"http://10.0.2.2:3102"'
            buildConfigField 'String', 'VAULT_NAMESPACE', '"field.mobile003qa"'
        }
        // Isolated Mobile004 verifier. Its package/store cannot replace the user demo, the
        // Mobile002 fixture, or the Mobile003 installed-store upgrade source.
        mobile004qa {
            dimension 'origin'
            applicationId 'org.crm.field.mobile004qa'
            testApplicationId 'org.crm.field.mobile004qa.test'
            buildConfigField 'String', 'API_BASE', '"http://10.0.2.2:3102"'
            buildConfigField 'String', 'VAULT_NAMESPACE', '"field.mobile004qa"'
        }
        mobile004upgradeqa { dimension 'origin'; applicationId 'org.crm.field.mobile004upgradeqa'; buildConfigField 'String','API_BASE','"http://10.0.2.2:3102"'; buildConfigField 'String','VAULT_NAMESPACE','"field.mobile004upgradeqa"' }
        // Mobile005 has isolated normal and in-place-upgrade identities. Neither reuses a prior
        // verifier's encrypted store, package, API listener, or build output.
        mobile005qa { dimension 'origin'; applicationId 'org.crm.field.mobile005qa'; testApplicationId 'org.crm.field.mobile005qa.test'; buildConfigField 'String','API_BASE','"http://10.0.2.2:3103"'; buildConfigField 'String','VAULT_NAMESPACE','"vaultfield.mobile005qa"' }
        mobile005upgradeqa { dimension 'origin'; applicationId 'org.crm.field.mobile005upgradeqa'; testApplicationId 'org.crm.field.mobile005upgradeqa.test'; buildConfigField 'String','API_BASE','"http://10.0.2.2:3103"'; buildConfigField 'String','VAULT_NAMESPACE','"vaultfield.mobile005upgradeqa"' }
    }
    buildFeatures { compose = true; buildConfig = true }
    buildTypes {
        debug { }
        release { buildConfigField 'String', 'API_BASE', '""'; minifyEnabled = false }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    sourceSets { androidTest.assets.srcDirs += '../mobile/contracts' }
    packaging { resources.excludes += ['META-INF/AL2.0','META-INF/LGPL2.1'] }
}
// QA verification must never replace the checkout's Gradle build products used by a running
// demo.  This is intentionally opt-in so normal developer builds keep their existing path.
if (providers.gradleProperty('CRM_MOBILE005_ANDROID_BUILD_DIR').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('CRM_MOBILE005_ANDROID_BUILD_DIR').get()))
} else if (providers.gradleProperty('CRM_MOBILE004_ANDROID_BUILD_DIR').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('CRM_MOBILE004_ANDROID_BUILD_DIR').get()))
} else if (providers.gradleProperty('CRM_MOBILE003_ANDROID_BUILD_DIR').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('CRM_MOBILE003_ANDROID_BUILD_DIR').get()))
} else if (providers.gradleProperty('CRM_MOBILE002_ANDROID_BUILD_DIR').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('CRM_MOBILE002_ANDROID_BUILD_DIR').get()))
}
dependencyLocking { lockAllConfigurations() }
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.sqlite:sqlite:2.7.1'
    implementation 'net.zetetic:sqlcipher-android:4.19.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
