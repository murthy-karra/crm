[package]
name = "crm-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "crm-api"
# Test-binary consolidation chunk (docs/tasks/TEST_BINARY_CONSOLIDATION.md):
# disables cargo's automatic "every tests/*.rs is its own binary"
# discovery. Every integration test target below is now explicit: the
# aggregated hub (`tests/all.rs`, covering every file except
# `livekit_telephony.rs`) plus the standalone `livekit_telephony`
# target that must stay out of the default run.
autotests = false

[lints]
workspace = true

[features]
# `telephony::ScriptedProvider` for the integration tests (docs/specs/
# SLICE_006.md §3, §14 item 7), mirroring crm-operator's feature.
test-support = ["crm-app/test-support"]
# The retained Phase B authenticated HTTP benchmark is an explicit release
# command, never a normal ignored test: `scripts/check-db` runs every ignored
# target and must not launch load while validating the ordinary DB suite.
perf-harness = ["test-support"]

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
crm-app = { path = "../crm-app" }
crm-operator = { path = "../crm-operator" }
async-trait = { workspace = true }

[dev-dependencies]
crm-api = { path = ".", features = ["test-support"] }
crm-app = { path = "../crm-app", features = ["test-support"] }
crm-operator = { path = "../crm-operator", features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# LiveKit-backed tests (docs/specs/SLICE_006.md §13 item 3): excluded from
# plain `cargo test` (so `check` and `check-db`, which runs `--ignored`
# across every test binary, never reach a network host) and run only by
# name from scripts/check-telephony.
[[test]]
name = "all"
path = "tests/all.rs"

# Opt-in only. The source is intentionally outside `tests/all.rs` and this
# target is absent unless `--features perf-harness` is supplied to the one
# documented Phase B release command.
[[test]]
name = "db_today_http_perf"
path = "tests/db_today_http_perf.rs"
required-features = ["perf-harness"]

# Slice 011d §8 Phase B evidence. Same opt-in shape as db_today_http_perf
# above: outside tests/all.rs, absent unless --features perf-harness.
[[test]]
name = "db_today_feeds_http_perf"
path = "tests/db_today_feeds_http_perf.rs"
required-features = ["perf-harness"]

[[test]]
name = "livekit_telephony"
test = false

[[example]]
name = "snapshot_qa"
path = "examples/snapshot_qa.rs"
required-features = ["test-support"]

[[example]]
name = "import_qa"
path = "examples/import_qa.rs"
required-features = ["test-support"]

[[example]]
name = "metadata_import_qa"
path = "examples/metadata_import_qa.rs"
required-features = ["test-support"]
