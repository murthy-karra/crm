[package]
name = "crm-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "crm-api"

[lints]
workspace = true

[features]
# `telephony::ScriptedProvider` for the integration tests (docs/specs/
# SLICE_006.md §3, §14 item 7), mirroring crm-operator's feature.
test-support = ["crm-app/test-support"]

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
chacha20poly1305 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
crm-app = { path = "../crm-app" }
crm-operator = { path = "../crm-operator" }
async-trait = { workspace = true }

[dev-dependencies]
crm-api = { path = ".", features = ["test-support"] }
crm-app = { path = "../crm-app", features = ["test-support"] }
crm-operator = { path = "../crm-operator", features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# LiveKit-backed tests (docs/specs/SLICE_006.md §13 item 3): excluded from
# plain `cargo test` (so `check` and `check-db`, which runs `--ignored`
# across every test binary, never reach a network host) and run only by
# name from scripts/check-telephony.
[[test]]
name = "livekit_telephony"
test = false
