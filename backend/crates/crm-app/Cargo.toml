[package]
name = "crm-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# `telephony::ScriptedProvider` for crm-api's integration tests
# (docs/specs/SLICE_006.md §3, §14 item 7); forwarded by crm-api's own
# `test-support` feature.
test-support = []

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
# LiveKit is https; the TLS backend must be declared here, not inherited
# by feature unification (docs/specs/SLICE_006a.md §3).
reqwest = { workspace = true, features = ["rustls-tls"] }
async-trait = { workspace = true }
# Confined to domain/intake/email/mime.rs (docs/specs/SLICE_007d.md §4a;
# a directory-walk fence test enforces it). Default features (charset
# decoding is wanted for real mail); no serde feature.
mail-parser = { workspace = true }

[dev-dependencies]
# The fake LiveKit server test in telephony/livekit.rs only.
axum = { workspace = true }
